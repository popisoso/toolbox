<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Never send this page's URL as a Referer to anyone (incl. the Anthropic API). -->
    <meta name="referrer" content="no-referrer" />
    <title>Toolbox</title>
    <meta name="description" content="Owned, modular media production toolkit." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- iOS: standalone (no Safari chrome) once added to the Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Toolbox" />
    <!-- theme-color is kept in sync with --color-bg at runtime (src/shell/theme.ts) -->
    <meta name="theme-color" content="#f2f2f2" />
    <!-- Boot fallback. Inline so it needs no request; the build adds its hash
         to the CSP. Shows "Loading" after 1.5 s and a hint after 8 s; the shell
         replaces #app's children on first render, which removes it. -->
    <style>
      #boot { padding: 24px; font: 16px/1.45 system-ui, -apple-system, sans-serif; }
      #boot p { margin: 0 0 8px; }
      #boot pre { white-space: pre-wrap; word-break: break-word; font: 13px/1.4 ui-monospace, Menlo, monospace; }
      .boot-wait, .boot-stuck { opacity: 0; animation: boot-in 0s forwards; }
      .boot-wait { animation-delay: 1.5s; }
      .boot-stuck { animation-delay: 8s; }
      #boot:not(.failed) .boot-err, #boot.failed .boot-wait, #boot.failed .boot-stuck { display: none; }
      @keyframes boot-in { to { opacity: 1; } }
    </style>
    <!-- Boot guard. Inline (hash-allowed by the CSP) so it runs even when no
         other request completes. Reports a failed script load or a startup
         exception into #boot; and if the shell has not rendered after a few
         seconds while a service worker controls the page, unregisters the
         worker, clears its caches and reloads once. -->
    <script>
      (function () {
        'use strict';
        var HEAL_AFTER_MS = 6000;
        var HEAL_FLAG = 'toolbox.healed';
        function boot() { return document.getElementById('boot'); }
        function fail(message) {
          var b = boot();
          if (!b) return; // app already rendered; not a boot failure
          b.className = 'failed';
          var pre = b.querySelector('.boot-err pre');
          if (pre) pre.textContent = message;
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) { fail('Could not load ' + (t.src || t.href)); return; }
          var where = e.filename ? '\n' + e.filename.replace(/^.*\//, '') + ':' + e.lineno : '';
          fail((e.message || 'Script error') + where);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          fail(r && r.message ? r.message : String(r));
        });
        setTimeout(function () {
          var b = boot();
          var sw = navigator.serviceWorker;
          if (!b || b.className === 'failed' || !sw || !sw.controller) return;
          var healed = false;
          try { healed = sessionStorage.getItem(HEAL_FLAG) === '1'; } catch (e) { /* ignore */ }
          if (healed) return; // already tried once this session; do not loop
          try { sessionStorage.setItem(HEAL_FLAG, '1'); } catch (e) { /* ignore */ }
          var note = b.querySelector('.boot-heal');
          if (note) note.hidden = false;
          var budget = new Promise(function (r) { setTimeout(r, 3000); });
          var work = Promise.resolve()
            .then(function () { return sw.getRegistrations(); })
            .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
            .then(function () { return typeof caches !== 'undefined' ? caches.keys() : []; })
            .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
            .catch(function () { /* best effort */ });
          Promise.race([work, budget]).then(function () { location.reload(); });
        }, HEAL_AFTER_MS);
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div id="boot" role="status">
        <noscript><p>Toolbox needs JavaScript. Enable it in your browser settings and reload.</p></noscript>
        <p class="boot-wait">Loading Toolbox…</p>
        <p class="boot-stuck">Still loading. Check your connection and reload. If this keeps happening, try a private tab.</p>
        <p class="boot-heal" hidden>Resetting the offline copy and reloading…</p>
        <div class="boot-err"><p>Toolbox could not start. Reload to try again.</p><pre></pre></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
